<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bilgi Yolu – Ders Oyunu</title>
<style>
:root{
  --bg:#1a1d23; --surface:#22262e; --surface2:#2a2f38; --line:#363c47;
  --ink:#d8dce2; --muted:#8a92a0; --accent:#86b5a5; --accent-ink:#13201b; --accent2:#cfae74;
  --ok:#86c29a; --ok-bg:rgba(134,194,154,.12); --bad:#dc9090; --bad-bg:rgba(220,144,144,.12);
  --hint-bg:rgba(207,174,116,.10);
  --f1:rgba(120,165,215,.28); --f2:rgba(134,190,150,.28); --f3:rgba(215,175,105,.30); --f4:rgba(215,130,140,.28); --f5:rgba(170,150,215,.28);
  --k1:#8fb4dd; --k2:#8cc49e; --k3:#d9b56f; --k4:#de9aa3; --k5:#b4a3dd;
  --shadow:0 6px 24px rgba(0,0,0,.25);
  --radius:14px;
}
html[data-theme="light"]{
  --bg:#f3f0e9; --surface:#fbfaf6; --surface2:#f0ece3; --line:#ddd6c8;
  --ink:#2c3038; --muted:#757b86; --accent:#4c8573; --accent-ink:#ffffff; --accent2:#a87f37;
  --ok:#3f8a57; --ok-bg:rgba(63,138,87,.10); --bad:#b9504f; --bad-bg:rgba(185,80,79,.09);
  --hint-bg:rgba(168,127,55,.10);
  --f1:rgba(70,120,190,.18); --f2:rgba(60,150,90,.18); --f3:rgba(200,150,60,.22); --f4:rgba(200,90,100,.18); --f5:rgba(130,100,200,.18);
  --k1:#3f6fae; --k2:#3b8a55; --k3:#a8792a; --k4:#b25462; --k5:#6e58b0;
  --shadow:0 6px 24px rgba(60,50,30,.10);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,"Helvetica Neue",Arial,sans-serif;min-height:100vh;transition:background .25s,color .25s}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:860px;margin:0 auto;padding:20px 18px 60px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}
.brand{display:flex;align-items:center;gap:10px;font-weight:650;letter-spacing:.2px;font-size:18px}
.brand .dot{width:12px;height:12px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 25%,transparent)}
.icon-btn{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:7px 12px;font-size:14px;color:var(--muted);display:inline-flex;align-items:center;gap:6px;transition:.15s}
.icon-btn:hover{color:var(--ink);border-color:var(--muted)}
.hero{margin:10px 0 26px}
.hero h1{font-size:30px;margin:0 0 6px;font-weight:700;letter-spacing:-.3px}
.hero p{margin:0;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;transition:transform .15s,border-color .15s,box-shadow .15s;text-align:left;width:100%}
.subject{display:flex;flex-direction:column;gap:10px;min-height:150px;position:relative;overflow:hidden}
.subject:hover{transform:translateY(-2px);border-color:var(--sc,var(--accent));box-shadow:var(--shadow)}
.subject .ico{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--sc) 18%,transparent);color:var(--sc)}
.subject .ico svg{width:24px;height:24px}
.subject h3{margin:0;font-size:18px}
.subject .meta{color:var(--muted);font-size:13.5px;margin-top:auto;display:flex;justify-content:space-between}
.subject .tag{font-size:12px;color:var(--sc)}
.opts{display:flex;flex-wrap:wrap;gap:18px;align-items:center;margin:26px 0 8px;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);font-size:14.5px;color:var(--muted)}
.seg{display:inline-flex;background:var(--surface2);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:5px 12px;border-radius:8px;color:var(--muted);font-size:14px}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
label.chk{display:inline-flex;gap:8px;align-items:center;cursor:pointer}
label.chk input{accent-color:var(--accent);width:16px;height:16px}
.foot{margin-top:28px;color:var(--muted);font-size:13px;text-align:center}

/* oyun */
.bar{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.bar .title{font-weight:650;display:flex;align-items:center;gap:8px}
.bar .title i{width:10px;height:10px;border-radius:50%;background:var(--sc);display:inline-block}
.bar .sp{flex:1}
.pill{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:13.5px;color:var(--muted)}
.pill b{color:var(--ink);font-weight:650}
.progress{height:4px;background:var(--surface2);border-radius:4px;overflow:hidden;margin-bottom:18px}
.progress>div{height:100%;background:var(--sc,var(--accent));transition:width .35s}
.qcard{padding:22px 22px 18px}
.qnum{font-size:13px;color:var(--muted);margin-bottom:8px;display:flex;justify-content:space-between}
.passage{background:var(--surface2);border-left:3px solid var(--sc,var(--accent));border-radius:10px;padding:12px 16px;margin-bottom:14px;font-size:14.5px;max-height:300px;overflow:auto;line-height:1.65}
.passage h4{margin:4px 0 6px;font-size:14px;letter-spacing:.3px}
.passage p{margin:0 0 10px}
.passage .src{text-align:right;color:var(--muted);font-style:italic}
.qtext{font-size:18px;font-weight:550;line-height:1.55;margin-bottom:6px}
.qtext .sub{display:block;font-size:14px;font-weight:400;color:var(--muted);margin-top:4px}
.qtext u b,.qtext b u{color:var(--accent2)}
figure.fig{margin:14px 0 6px;display:flex;justify-content:center;background:var(--surface2);border-radius:12px;padding:12px}
figure.fig svg{max-width:100%;height:auto;display:block}
.inputs{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.field{display:flex;align-items:center;gap:10px}
.field label{min-width:0;flex:0 0 auto;max-width:45%;font-size:14.5px;color:var(--muted)}
.field input,.field textarea{flex:1;min-width:0;background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:11px 14px;color:var(--ink);font:inherit;outline:none;transition:border-color .15s,background .15s}
.field textarea{min-height:120px;resize:vertical;line-height:1.5}
.field input:focus,.field textarea:focus{border-color:var(--accent)}
.field.ok input,.field.ok textarea{border-color:var(--ok);background:var(--ok-bg)}
.field.bad input,.field.bad textarea{border-color:var(--bad);background:var(--bad-bg)}
.actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface2);padding:10px 18px;border-radius:10px;font-weight:550;font-size:15px;transition:.15s}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink)}
.btn:disabled{opacity:.45;cursor:default}
.hints{margin-top:14px;display:flex;flex-direction:column;gap:8px}
.hint{background:var(--hint-bg);border:1px solid color-mix(in srgb,var(--accent2) 35%,transparent);border-radius:10px;padding:9px 13px;font-size:14.5px;animation:fade .3s}
.hint b{color:var(--accent2);font-weight:650;margin-right:6px}
.fb{margin-top:14px;border-radius:12px;padding:12px 15px;font-size:15px;animation:fade .3s}
.fb.ok{background:var(--ok-bg);border:1px solid color-mix(in srgb,var(--ok) 45%,transparent)}
.fb.bad{background:var(--bad-bg);border:1px solid color-mix(in srgb,var(--bad) 45%,transparent)}
.fb .h{font-weight:650;margin-bottom:4px}
.fb.ok .h{color:var(--ok)} .fb.bad .h{color:var(--bad)}
.fb .alt{color:var(--muted);font-size:13.5px;margin-top:6px}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.kbd{font-size:12px;color:var(--muted);margin-left:auto}

/* sonuç */
.result{text-align:center;padding:30px 22px}
.result .big{font-size:52px;font-weight:750;color:var(--sc,var(--accent));line-height:1.1}
.result .sub{color:var(--muted);margin-top:6px}
.stats{display:flex;justify-content:center;gap:12px;margin:20px 0;flex-wrap:wrap}
.stat{background:var(--surface2);border-radius:12px;padding:10px 18px;min-width:96px}
.stat b{display:block;font-size:22px}
.stat span{font-size:12.5px;color:var(--muted)}
.review{margin-top:18px;text-align:left;display:flex;flex-direction:column;gap:8px}
.rv{display:flex;gap:12px;padding:10px 12px;border-radius:10px;background:var(--surface2);font-size:14.5px;align-items:flex-start}
.rv .st{flex:0 0 26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700}
.rv .st.ok{background:var(--ok-bg);color:var(--ok)} .rv .st.bad{background:var(--bad-bg);color:var(--bad)}
.rv .ans{color:var(--muted);font-size:13.5px}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;z-index:50;animation:fade .2s;padding:16px}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;max-width:380px;width:100%;box-shadow:var(--shadow)}
.modal h3{margin:0 0 6px}
.modal p{margin:0 0 18px;color:var(--muted);font-size:14.5px}
.modal .actions{justify-content:flex-end}
.player{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;margin:0 0 16px}
.player .ph{display:flex;flex-direction:column;margin-right:auto;font-size:13px;color:var(--muted)}
.player .ph b{color:var(--ink);font-size:15.5px}
.prow,.pform{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.player select,.player input,.minput{background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;color:var(--ink);font:inherit;outline:none;min-width:0}
.player select{max-width:220px}
.player select:focus,.player input:focus,.minput:focus{border-color:var(--accent)}
.minput{width:100%;margin:8px 0 16px}
.scores-card{margin-top:18px}
.scores-card h3{margin:0 0 8px;font-size:16px}
.tbl-wrap{overflow-x:auto}
table.scores{width:100%;border-collapse:collapse;font-size:14px;min-width:440px}
.scores th,.scores td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
.scores thead th{font-size:12.5px;color:var(--muted);font-weight:600}
.scores tbody th{font-weight:600;white-space:nowrap}
.scores tbody th i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px;vertical-align:middle}
.scores td b{display:block;font-size:15px}
.scores td b.hi{color:var(--ok)} .scores td b.mid{color:var(--accent2)} .scores td b.lo{color:var(--bad)}
.scores td small{color:var(--muted);font-size:11.5px;white-space:nowrap}
.scores td small em,.scores td small i{font-style:normal}
.scores td.empty{color:var(--muted)}
.scores tbody tr:last-child th,.scores tbody tr:last-child td{border-bottom:0}

/* svg */
svg text{fill:var(--ink);font-family:system-ui,sans-serif;font-size:14px}
svg .ink{stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
svg .thin{stroke:var(--muted);fill:none;stroke-width:1.2}
svg .dash{stroke:var(--muted);fill:none;stroke-width:1.4;stroke-dasharray:5 4}
svg .mut{fill:var(--muted)}
svg .acc{fill:var(--accent2)} svg .sacc{stroke:var(--accent2);fill:none;stroke-width:2.2}
svg .f1{fill:var(--f1);stroke:var(--k1);stroke-width:1.6} svg .f2{fill:var(--f2);stroke:var(--k2);stroke-width:1.6}
svg .f3{fill:var(--f3);stroke:var(--k3);stroke-width:1.6} svg .f4{fill:var(--f4);stroke:var(--k4);stroke-width:1.6}
svg .f5{fill:var(--f5);stroke:var(--k5);stroke-width:1.6}
svg .k1{stroke:var(--k1);fill:none;stroke-width:2.2} svg .k2{stroke:var(--k2);fill:none;stroke-width:2.2}
svg .k3{stroke:var(--k3);fill:none;stroke-width:2.2} svg .k4{stroke:var(--k4);fill:none;stroke-width:2.2} svg .k5{stroke:var(--k5);fill:none;stroke-width:2.2}
svg .t1{fill:var(--k1)} svg .t2{fill:var(--k2)} svg .t3{fill:var(--k3)} svg .t4{fill:var(--k4)} svg .t5{fill:var(--k5)}
svg .mk{fill:var(--ink)} svg .mka{fill:var(--accent2)} svg .mk4{fill:var(--k4)} svg .mk1{fill:var(--k1)}
svg .qb{fill:var(--accent2)} svg .qbt{fill:var(--bg);font-weight:800}

/* özel kartlar (hata defteri / karışık sınav) */
.subject.special .ico{background:color-mix(in srgb,var(--sc) 20%,transparent);color:var(--sc);font-size:20px;font-weight:700}
.subject.special{border-style:dashed}

/* konu seçimi */
.pick{padding:20px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface2);border-radius:999px;padding:7px 14px;font-size:14px;color:var(--muted);transition:.15s}
.chip:hover{border-color:var(--muted);color:var(--ink)}
.chip.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--ink);font-weight:600}
.pick-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:18px}
.pick-foot span{color:var(--muted);font-size:14px}

/* formül kağıdı */
.fgrid{display:grid;gap:14px}
.fsec{padding:16px 18px}
.fsec h3{margin:0 0 4px;font-size:16px;color:var(--sc,var(--accent))}
.fnote{margin:2px 0 8px;color:var(--muted);font-size:13.5px}
.fbody{display:grid;grid-template-columns:minmax(190px,300px) 1fr;gap:18px;align-items:start}
.ffig{margin:0;display:flex;flex-direction:column;align-items:center;background:var(--surface2);border-radius:12px;padding:12px}
.ffig svg{max-width:100%;height:auto;display:block}
.ffig figcaption{margin-top:8px;color:var(--muted);font-size:12px;text-align:center;line-height:1.35}
.ftable{display:flex;flex-direction:column}
.frow{display:grid;grid-template-columns:minmax(130px,44%) 1fr;gap:12px;padding:7px 0;border-top:1px solid var(--line);align-items:baseline}
.frow:first-child{border-top:0}
.fk{color:var(--muted);font-size:14px}
.fv{font-size:14.5px;color:var(--ink);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
@media(max-width:640px){ .fbody{grid-template-columns:1fr} }

/* süre sayacı */
.pill.timer{font-variant-numeric:tabular-nums;border-color:color-mix(in srgb,var(--accent2) 55%,transparent)}
.pill.timer b{color:var(--accent2)}
.pill.timer.low{border-color:var(--bad);animation:pulse 1s infinite}
.pill.timer.low b{color:var(--bad)}
.pill.streak{border-color:color-mix(in srgb,var(--accent2) 60%,transparent);background:color-mix(in srgb,var(--accent2) 14%,var(--surface));color:var(--ink);animation:streakIn .35s cubic-bezier(.2,.7,.3,1)}
.pill.streak b{color:var(--accent2)}
@keyframes streakIn{from{transform:scale(.85);opacity:.4}to{transform:none;opacity:1}}
.focus-note{background:color-mix(in srgb,var(--ok) 12%,transparent);border:1px solid color-mix(in srgb,var(--ok) 40%,transparent);border-radius:10px;padding:8px 13px;font-size:13.5px;color:var(--ink);margin-bottom:12px}

/* konu analizi */
.analysis{margin:20px 0 4px;text-align:left}
.analysis h3{margin:0 0 2px;font-size:16px}
.analysis .an-sub{margin:0 0 12px;color:var(--muted);font-size:13px}
.an-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:14px}
.an-name{flex:0 0 42%;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.an-bar{flex:1;height:9px;background:var(--surface2);border-radius:6px;overflow:hidden}
.an-bar i{display:block;height:100%;border-radius:6px;transition:width .6s cubic-bezier(.2,.7,.3,1)}
.an-bar i.hi{background:var(--ok)} .an-bar i.mid{background:var(--accent2)} .an-bar i.lo{background:var(--bad)}
.an-pct{flex:0 0 44px;text-align:right;font-weight:650;font-variant-numeric:tabular-nums}
.an-pct.hi{color:var(--ok)} .an-pct.mid{color:var(--accent2)} .an-pct.lo{color:var(--bad)}

/* animasyonlar */
.subject{animation:cardIn .4s cubic-bezier(.2,.7,.3,1) both}
@keyframes cardIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
#pts.bump{display:inline-block;animation:bump .3s}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.35);color:var(--accent2)}100%{transform:scale(1)}}
.fb.ok{animation:pop .3s cubic-bezier(.2,.7,.3,1)}
@keyframes pop{0%{transform:scale(.97)}60%{transform:scale(1.01)}100%{transform:none}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.opts .sep{width:1px;height:20px;background:var(--line);margin:0 2px}

/* ekran geçişi */
#app.screen-in{animation:screenIn .34s cubic-bezier(.2,.7,.3,1) both}
@keyframes screenIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* konfeti */
.confetti-layer{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:60}
.confetti{position:absolute;top:14%;border-radius:2px;opacity:0;will-change:transform,opacity;
  animation-name:confettiFly;animation-timing-function:cubic-bezier(.25,.6,.4,1);animation-fill-mode:forwards}
.confetti.round{border-radius:50%}
@keyframes confettiFly{
  0%{opacity:0;transform:translate(-50%,0) rotate(0deg) scale(.6)}
  12%{opacity:1}
  70%{opacity:1}
  100%{opacity:0;transform:translate(calc(-50% + var(--dx)),var(--dy)) rotate(var(--rot)) scale(1)}
}

/* uçan puan */
.float-pts{position:fixed;transform:translate(-50%,0);font-weight:750;font-size:18px;color:var(--accent2);
  pointer-events:none;z-index:61;text-shadow:0 1px 6px rgba(0,0,0,.35);animation:floatUp 1s ease-out forwards}
.float-pts.bonus{color:var(--ok);font-size:20px}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,6px) scale(.8)}
  20%{opacity:1;transform:translate(-50%,-4px) scale(1.05)}
  100%{opacity:0;transform:translate(-50%,-46px) scale(1)}}

/* doğru cevap onay işareti */
.check-mark{width:22px;height:22px;display:inline-block;vertical-align:-5px;margin-right:7px}
.check-mark path{fill:none;stroke:var(--ok);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:32;stroke-dashoffset:32;animation:drawCheck .4s ease-out .05s forwards}
@keyframes drawCheck{to{stroke-dashoffset:0}}

/* ilerleme çubuğu parlaması */
.progress>div::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);
  animation:sheen 1.6s ease-in-out infinite}
.progress>div{position:relative;overflow:hidden}
@keyframes sheen{0%{transform:translateX(-100%)}60%,100%{transform:translateX(220%)}}

/* kombo vurgusu */
.pill.streak{position:relative}
.pill.streak::after{content:"";position:absolute;inset:-2px;border-radius:999px;
  box-shadow:0 0 0 0 color-mix(in srgb,var(--accent2) 60%,transparent);animation:streakGlow 1.4s ease-out infinite}
@keyframes streakGlow{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent2) 55%,transparent)}
  100%{box-shadow:0 0 0 10px rgba(0,0,0,0)}}

/* sonuç istatistik girişi */
.stat{animation:statIn .45s cubic-bezier(.2,.7,.3,1) both}
@keyframes statIn{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}
.result .big{animation:bigIn .5s cubic-bezier(.2,.7,.3,1) both}
@keyframes bigIn{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:none}}
.rv{animation:rvIn .35s ease-out both}
@keyframes rvIn{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}

/* buton mikro etkileşimi */
.btn:active{transform:scale(.96)}
.btn.primary{transition:.15s,transform .08s}
.chip:active{transform:scale(.94)}
.subject:active{transform:translateY(-1px) scale(.99)}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:560px){

<script>
/* Esnek cevap kontrolü: Türkçe karakter, büyük/küçük harf, yazım hatası ve ek toleransı */
var M = (function(){
  var MAP = {'ı':'i','ş':'s','ğ':'g','ü':'u','ö':'o','ç':'c','â':'a','î':'i','û':'u','é':'e','ë':'e','ä':'a'};
  function lower(s){ return String(s).replace(/İ/g,'i').replace(/I/g,'ı').toLowerCase(); }
  function norm(s){
    s = lower(s).replace(/√/g,' kok ').replace(/²/g,'2').replace(/³/g,'3').replace(/₂/g,'2');
    s = s.replace(/[ışğüöçâîûéëä]/g, function(c){ return MAP[c]; });
    s = s.replace(/['’‘`´"“”]/g,'');
    s = s.replace(/[^a-z0-9]+/g,' ').trim();
    return s;
  }
  function lev(a,b,max){
    if(a===b) return 0;
    var la=a.length, lb=b.length;
    if(Math.abs(la-lb)>max) return max+1;
    var pp=new Array(lb+1), prev=new Array(lb+1), cur=new Array(lb+1), i, j;
    for(j=0;j<=lb;j++) prev[j]=j;
    for(i=1;i<=la;i++){
      cur[0]=i; var best=cur[0];
      for(j=1;j<=lb;j++){
        var c = a.charCodeAt(i-1)===b.charCodeAt(j-1)?0:1;
        cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+c);
        if(i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1]) cur[j]=Math.min(cur[j],pp[j-2]+1);
        if(cur[j]<best) best=cur[j];
      }
      if(best>max) return max+1;
      var t=pp; pp=prev; prev=cur; cur=t;
    }
    return prev[lb];
  }
  function thr(len, strict){
    if(strict) return 0;
    if(len<=3) return 0;
    if(len<=6) return 1;
    if(len<=10) return 2;
    return 3;
  }
  /* girdinin içinde hedefe en yakın parçanın uzaklığı */
  function dist(inp, tgt){
    var T = thr(tgt.length) + 2, best = lev(inp,tgt,T);
    var tn = tgt.replace(/ /g,'');
    best = Math.min(best, lev(inp.replace(/ /g,''), tn, T));
    var toks = inp.split(' '), k = tgt.split(' ').length;
    for(var w=Math.max(1,k-1); w<=k+1; w++){
      for(var i=0;i+w<=toks.length;i++){
        var win = toks.slice(i,i+w).join(' ');
        best = Math.min(best, lev(win,tgt,T), lev(win.replace(/ /g,''),tn,T));

          // Türkçe ekler: "mitokondridir" -> "mitokondri"
          if(win.length - tgt.length <= 6){
            best = Math.min(best, lev(win.slice(0,tgt.length),tgt,T));
          }
        }
        if(best===0) return 0;
      }

  }
  function nums(raw){
    var s = String(raw).replace(/(\d),(\d)/g,'$1.$2');
    var out=[], re=/(-?\d+(?:\.\d+)?)(?:\s*[\/:]\s*(-?\d+(?:\.\d+)?))?/g, m;
    while((m=re.exec(s))){
      var v=parseFloat(m[1]);
      if(m[2]!==undefined){ var d=parseFloat(m[2]); if(d!==0) out.push(v/d); out.push(v); out.push(d); }
      else out.push(v);
    }
    return out;
  }
  function numMatch(raw, targets, tol){
    targets = [].concat(targets); tol = tol==null?0.02:tol;
    var ns = nums(raw);
    // kesirli cevap bekleniyorsa pay/payda tek başına sayılmasın
    var s = String(raw).replace(/(\d),(\d)/g,'$1.$2');
    var fr = /(-?\d+(?:\.\d+)?)\s*[\/:]\s*(-?\d+(?:\.\d+)?)/g, m, fracs=[], plain=s.replace(fr,function(a,p,q){ fracs.push(parseFloat(p)/parseFloat(q)); return ' '; });
    var cand = fracs.concat(nums(plain).filter(function(x){return true;}));
    for(var i=0;i<cand.length;i++) for(var j=0;j<targets.length;j++){
      var t=targets[j]; if(Math.abs(cand[i]-t) <= Math.max(Math.abs(t)*tol,1e-9)) return true;
    }
    return false;
  }
  function bestOf(inp, list, strict){
    var b={d:99,len:0};
    (list||[]).forEach(function(a){
      var t=norm(a); if(!t) return;
      var d = strict ? (inp.replace(/ /g,'')===t.replace(/ /g,'')?0:99) : dist(inp,t);
      var ok = d<=thr(t.length,strict);
      if(d<b.d || (d===b.d && ok)) b={d:d,len:t.length,ok:ok};
    });
    return b;
  }
  function has(inp, alts){ return bestOf(inp, [].concat(alts)).ok; }
  /* spec: {a, not, num, tol, strict, keys, minKeys, all} */
  function check(raw, spec){
    var inp = norm(raw), rt = String(raw).trim();
    if(!rt) return false;
    if(spec.raw && spec.raw.indexOf(rt)>=0) return true;
    if(spec.minWords && rt.split(/\s+/).length < spec.minWords) return false;
    if(spec.cap && rt.charAt(0)===rt.charAt(0).toLocaleLowerCase('tr')) return false;
    if(spec.exact){
      var e = (spec.a||[]).some(function(a){ return norm(a)===inp; });
      return e;
    }
    if(spec.num!=null && numMatch(raw, spec.num, spec.tol)) return true;
    if(spec.all){
      for(var g=0; g<spec.all.length; g++) if(!has(inp, spec.all[g])) return false;
      return true;
    }
    if(spec.keys){
      var c=0; spec.keys.forEach(function(g){ if(has(inp,g)) c++; });
      if(c >= (spec.minKeys||1)) return true;
    }
    if(spec.a){
      var acc = bestOf(inp, spec.a, spec.strict);
      if(acc.ok){
        if(spec.not){
          var bad = bestOf(inp, spec.not, false);
          if(bad.ok && (bad.d < acc.d || (bad.d===acc.d && bad.len > acc.len))) return false;
        }
        return true;
      }
    }
    return false;
  }
  /* liste tipi: n girdinin her biri farklı bir havuz öğesiyle eşleşmeli */
  function checkList(inputs, pool, ordered){
    var used = {}, res = [];
    inputs.forEach(function(raw, i){
      var hit=-1;
      if(ordered){ if(pool[i] && check(raw,pool[i])) hit=i; }
      else for(var j=0;j<pool.length;j++){ if(!used[j] && check(raw,pool[j])){ hit=j; break; } }
      if(hit>=0) used[hit]=1;
      res.push(hit>=0);
    });
    return res;
  }
  return {norm:norm, lev:lev, check:check, checkList:checkList, nums:nums, numMatch:numMatch, dist:dist};
})();

/* Ders bazlı zayıf konu analizi — saf yardımcılar (DOM'suz, test edilebilir).
   Bir konu, çözülmemiş hatası (w) olduğu sürece "zayıf" sayılır; doğru cevap
   bir hatayı kapatır ve konu tamamlanınca listeden düşer. */
(function(){
  var WEAK_MAX_TOPICS = 4;

  function tkey(sid, topic){ return sid+'::'+(topic||'Genel'); }

  function questionsOf(s){ return s.levels ? s.levels.reduce(function(a,lv){ return a.concat(lv.questions); },[]) : s.questions; }

  /* Çözülmemiş hata sayısı. Eski (w alanı olmayan) kayıtlarda ok/n'den türetilir. */
  function openErrors(t){ return t.w==null ? Math.max((t.n||0)-(t.ok||0),0) : t.w; }

  /* Bir cevabı kayda işler: yanlış hata açar, doğru bir hatayı kapatır. */
  function recordResult(rec, ok){
    rec.w = openErrors(rec);
    rec.n = (rec.n||0)+1;
    if(ok) rec.ok = (rec.ok||0)+1;
    rec.w = Math.max(0, rec.w + (ok?-1:1));
    return rec;
  }

  /* Tek bir dersin zayıf konuları. Anahtar ders kapsamlı olduğu için dersler karışmaz. */
  function weakTopicsFor(tstats, sid){
    var ts=tstats||{}, out=[];
    Object.keys(ts).forEach(function(k){
      if(k.indexOf(sid+'::')!==0) return;
      var t=ts[k], w=openErrors(t); if(w<=0) return;
      out.push({topic:k.slice(sid.length+2), ok:t.ok||0, n:t.n||0, w:w,
        pct:Math.round((t.ok||0)/(t.n||1)*100), last:t.last||0});
    });
    out.sort(function(a,b){ return b.w-a.w || a.pct-b.pct || b.n-a.n || a.last-b.last; });
    return out.slice(0,WEAK_MAX_TOPICS);
  }

  /* Zayıf konuları ders ders gruplar. Her grupta o dersin zayıf konuları ve soru havuzu olur. */
  function weakBySubject(tstats, subjects, allQ){
    return subjects.map(function(s){
      var weak = weakTopicsFor(tstats, s.id); if(!weak.length) return null;
      var names = weak.map(function(w){ return w.topic; });
      var pool = allQ.filter(function(x){ return x.s===s && names.indexOf(x.q.topic||'Genel')>=0; });
      if(!pool.length) return null;
      return {s:s, weak:weak, open:weak.reduce(function(a,w){ return a+w.w; },0), pool:pool};
    }).filter(Boolean);
  }

  /* Eski (yalnızca konu adıyla anahtarlanmış) kayıtları ders kapsamlı anahtara taşır.
     Konu tek bir derse aitse taşınır; birden fazla derse aitse (belirsiz) silinir.
     Değişiklik yapıldıysa true döner. */
  function migrateTstats(tstats, subjects){
    var ts = tstats||{}, moved = {}, changed = false;
    Object.keys(ts).forEach(function(k){
      if(k.indexOf('::')>=0) return;
      var owners = subjects.filter(function(s){
        return questionsOf(s).some(function(q){ return (q.topic||'Genel')===k; });
      });
      if(owners.length===1){ var nk = owners[0].id+'::'+k; if(!ts[nk]) moved[nk]=ts[k]; delete ts[k]; }
      else delete ts[k];
      changed = true;
    });
    Object.keys(moved).forEach(function(k){ ts[k]=moved[k]; });
    return changed;
  }

  window.WEAK = { tkey:tkey, openErrors:openErrors, recordResult:recordResult,
    weakTopicsFor:weakTopicsFor, weakBySubject:weakBySubject, migrateTstats:migrateTstats,
    MAX_TOPICS:WEAK_MAX_TOPICS };
})();

/* Oyun animasyonları: ekran geçişi, konfeti, uçan puan, sayı sayma.
   DOM'a bağlı olmayan parçalar (spec üretimi) saf ve test edilebilir. */
var ANIM = (function(){
  function reduced(){
    try { return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches; }
    catch(e){ return false; }
  }

  /* Ekran geçişi: içeriği yazar ve kısa bir fade+slide animasyonu tetikler. */
  function render(app, html){
    app.innerHTML = html;
    if(reduced()) return;
    app.classList.remove('screen-in');
    void app.offsetWidth; /* reflow: animasyonun yeniden oynaması için */
    app.classList.add('screen-in');
  }

  /* Konfeti parçacıklarının konum/renk/zamanlama verisi. rnd() -> [0,1). */
  function confettiSpecs(n, rnd){
    rnd = rnd || Math.random;
    var colors = ['#86c29a','#cfae74','#8fb4dd','#de9aa3','#b4a3dd'];
    var out = [];
    for(var i=0;i<n;i++){
      out.push({
        left: rnd()*100,
        dx: (rnd()*2-1)*80,
        dy: 120 + rnd()*160,
        rot: (rnd()*2-1)*540,
        dur: 900 + rnd()*700,
        delay: rnd()*160,
        size: 6 + rnd()*7,
        round: rnd() < 0.35,
        color: colors[Math.floor(rnd()*colors.length)]
      });
    }
    return out;
  }

  /* Konfeti patlaması: geçici bir katman ekler. */
  function confetti(app, n){
    if(reduced()) return;
    var host = document.body || app;
    var layer = document.createElement('div');
    layer.className = 'confetti-layer';
    confettiSpecs(n).forEach(function(p){
      var el = document.createElement('i');
      el.className = 'confetti' + (p.round?' round':'');
      el.style.left = p.left + '%';
      el.style.width = el.style.height = p.size + 'px';
      el.style.background = p.color;
      el.style.setProperty('--dx', p.dx.toFixed(1)+'px');
      el.style.setProperty('--dy', p.dy.toFixed(1)+'px');
      el.style.setProperty('--rot', p.rot.toFixed(0)+'deg');
      el.style.animationDuration = p.dur + 'ms';
      el.style.animationDelay = p.delay + 'ms';
      layer.appendChild(el);
    });
    host.appendChild(layer);
    setTimeout(function(){ layer.remove(); }, 2000);
  }

  /* Puanın yanından yukarı süzülen "+N" yazısı. */
  function floatPoints(anchor, text, cls){
    if(reduced() || !anchor) return;
    var r = anchor.getBoundingClientRect();
    var el = document.createElement('span');
    el.className = 'float-pts' + (cls?' '+cls:'');
    el.textContent = text;
    el.style.left = (r.left + r.width/2) + 'px';
    el.style.top = (r.top - 4) + 'px';
    document.body.appendChild(el);
    setTimeout(function(){ el.remove(); }, 1100);
  }

  /* Bir sayıyı hedefe doğru yumuşak biçimde artırır. suffix: sayıdan sonra eklenecek metin. */
  function countUp(el, to, dur, suffix){
    if(!el) return;
    suffix = suffix||'';
    if(reduced()){ el.textContent = to + suffix; return; }
    var from = 0, start = null;
    dur = dur || 900;
    function step(ts){
      if(start==null) start = ts;
      var k = Math.min(1, (ts-start)/dur);
      var e = 1 - Math.pow(1-k, 3); /* easeOutCubic */
      el.textContent = Math.round(from + (to-from)*e) + suffix;
      if(k<1) requestAnimationFrame(step);
      else el.textContent = to + suffix;
    }
    requestAnimationFrame(step);
  }

  return { render:render, confetti:confetti, confettiSpecs:confettiSpecs, floatPoints:floatPoints, countUp:countUp, reduced:reduced };
})();

      if(!a) return null;
      var letters = a.replace(/[^A-Za-zÇĞİÖŞÜçğıöşüâîûÂÎÛ]/g,'').length;
      return '“'+a.charAt(0).toLocaleUpperCase('tr')+'” ile başlıyor'+(letters>1?' ('+letters+' harf)':'');
    };
    if(q.type==='parts'){
      var out=[]; q.parts.forEach(function(p,i){ if(!G.cur.done[i]){ var f=first(p); if(f) out.push((p.label?p.label.replace(/:$/,''):'')+': '+f); } });
      return out.length? out.join(' · ') : null;
    }
    if(q.type==='list'){
      var left = q.pool.filter(function(p,j){ return !G.cur.usedPool[j]; }).map(function(p){ return (p.a||[])[0] || (p.all||[]).map(function(g){return g[0];}).join(' – '); });
      if(q.ordered) return null;
      return left.length? 'Kabul edilen cevaplardan birinin baş harfi: “'+left[0].charAt(0)+'”' : null;
    }
    if(q.type==='free') return null;
    return first(q);
  }
  function hintList(q){
    var hs = (q.hints||[]).slice();
    var ah = autoHint(q); if(ah) hs.push(ah);
    return hs;
  }

  function fieldsHtml(q){
    if(q.type==='parts') return q.parts.map(function(p,i){
      return '<div class="field" data-k="'+i+'">'+(p.label?'<label>'+p.label+'</label>':'')+(p.long?'<textarea style="min-height:80px" spellcheck="false" placeholder="'+(p.ph||'Cevabın…')+'"></textarea>':'<input autocomplete="off" spellcheck="false" placeholder="'+(p.ph||'Cevabın…')+'">')+'</div>'; }).join('');
    if(q.type==='list'){ var h=''; for(var i=0;i<q.n;i++) h+='<div class="field" data-k="'+i+'"><label>'+(q.labels?q.labels[i]:(i+1)+'.')+'</label><input autocomplete="off" spellcheck="false" placeholder="'+(q.ordered?(i+1)+'. sıradaki…':'Cevabın…')+'"></div>';
      (q.extra||[]).forEach(function(p,j){ h+='<div class="field" data-k="'+(q.n+j)+'"><label>'+p.label+'</label>'+(p.long?'<textarea style="min-height:80px" spellcheck="false" placeholder="Cevabın…"></textarea>':'<input autocomplete="off" spellcheck="false" placeholder="Cevabın…">')+'</div>'; });
      return h; }
    if(q.type==='free') return '<div class="field" data-k="0"><textarea spellcheck="true" placeholder="'+(q.ph||'Cevabını buraya yaz…')+'"></textarea></div>';
    if(q.long) return '<div class="field" data-k="0"><textarea style="min-height:90px" spellcheck="false" placeholder="Cevabını kendi cümlelerinle yaz…"></textarea></div>';
    return '<div class="field" data-k="0"><input autocomplete="off" spellcheck="false" placeholder="Cevabını yaz…"></div>';
  }

  function question(){
    var q = G.qs[G.i], s=G.s;
    G.cur = {wrong:0, hints:0, done:{}, usedPool:{}, finished:false};
    var pct = Math.round(G.i/G.qs.length*100);
    var h = '<div class="bar" style="--sc:'+G.color+'">'+
      '<button class="icon-btn" id="homeBtn">← Ana Menü</button>'+
      '<div class="title"><i></i>'+esc(G.name)+(G.lv?' · '+G.lv.name:'')+'</div><div class="sp"></div>'+
      (G.timed?'<span class="pill timer'+(G.left<=60?' low':'')+'">⏱ <b id="tleft">'+fmtTime(Math.max(G.left,0))+'</b></span>':'')+
      '<span class="pill">Soru <b>'+(G.i+1)+'</b> / '+G.qs.length+'</span>'+
      (G.streak>=2?'<span class="pill streak" id="streakPill">🔥 Seri <b>'+G.streak+'</b> · +'+streakBonus(G.streak)+'</span>':'')+
      '<span class="pill">Puan <b id="pts">'+G.score+'</b></span>'+themeBtn()+'</div>'+
      '<div class="progress" style="--sc:'+G.color+'"><div style="width:'+pct+'%"></div></div>'+
      '<div class="card qcard" id="qc" style="--sc:'+G.color+'">'+
      (G.focus?'<div class="focus-note">🎯 Odak: '+esc(G.focus)+'</div>':'')+
      '<div class="qnum"><span>'+(q.topic||'')+'</span><span>'+(q.src||'')+'</span></div>'+
      (q.passage?'<div class="passage">'+q.passage+'</div>':'')+
      '<div class="qtext">'+q.q+(q.note?'<span class="sub">'+q.note+'</span>':'')+'</div>'+
      (q.svg?'<figure class="fig">'+q.svg+'</figure>':'')+
      '<div class="inputs">'+fieldsHtml(q)+'</div>'+
      '<div class="actions"><button class="btn primary" id="chk">Kontrol Et</button>'+
      '<button class="btn ghost" id="pass">Pas geç</button><button class="btn ghost" id="show" style="display:none">Cevabı göster</button>'+
      '<button class="btn primary" id="next" style="display:none">'+(G.i+1<G.qs.length?'Sonraki soru →':'Sonuçları gör →')+'</button>'+
      '<span class="kbd">Enter ↵</span></div>'+
      '<div class="hints" id="hints"></div><div id="fb"></div></div>';
    ANIM.render(app, h);
    bindTheme();
    $('#homeBtn').onclick = confirmHome;
    $('#chk').onclick = submit;
    $('#pass').onclick = function(){ reveal(true); };
    $('#show').onclick = function(){ reveal(false); };
    $('#next').onclick = next;
    app.querySelectorAll('.field input, .field textarea').forEach(function(inp,idx,all){
      inp.addEventListener('keydown',function(e){
        if(e.key==='Enter' && !(inp.tagName==='TEXTAREA' && e.shiftKey)){
          if(inp.tagName==='TEXTAREA' && q.type==='free') { if(!e.ctrlKey) return; }
          e.preventDefault();
          if(G.cur.finished){ next(); return; }
          if(all.length>1){
            for(var j=idx+1;j<all.length;j++){ if(!all[j].disabled && !all[j].value.trim()){ all[j].focus(); return; } }
          }
          submit();
        }
      });
    });
    startTimer();
    var f = app.querySelector('.field input, .field textarea'); if(f) f.focus({preventScroll:true});
    window.scrollTo(0,0);
  }

  function values(){ return Array.prototype.map.call(app.querySelectorAll('.field'), function(f){ var i=f.querySelector('input,textarea'); return i.value; }); }
  function mark(k, ok){
    var f = app.querySelector('.field[data-k="'+k+'"]'); if(!f) return;
    f.classList.remove('ok','bad'); f.classList.add(ok?'ok':'bad');
    if(ok){ var i=f.querySelector('input,textarea'); i.disabled=true; }
  }

  function evaluate(q, vals){
    if(q.type==='parts'){
      var all=true;
      q.parts.forEach(function(p,i){
        if(G.cur.done[i]) return;
        var ok = M.check(vals[i], p); if(ok) G.cur.done[i]=true; else all=false;
        mark(i, ok);
      });
      return all;
    }
    if(q.type==='list'){
      var pool=q.pool, all2=true;
      (q.extra||[]).forEach(function(p,j){ var k=q.n+j; if(G.cur.done[k]) return; var ok=M.check(vals[k],p); if(ok) G.cur.done[k]=true; else all2=false; mark(k,ok); });
      vals.slice(0,q.n).forEach(function(v,i){
        if(G.cur.done[i]) return;
        var hit=-1;
        if(q.ordered){ if(M.check(v,pool[i])) hit=i; }
        else for(var j=0;j<pool.length;j++){ if(!G.cur.usedPool[j] && M.check(v,pool[j])){ hit=j; break; } }
        if(hit>=0){ G.cur.usedPool[hit]=1; G.cur.done[i]=true; mark(i,true); }
        else { all2=false; mark(i,false); }
      });
      return all2;
    }
    if(q.type==='free'){
      var v=vals[0], c=q.check||{}, ok=true;
      var sent = v.split(/[.!?…]+/).filter(function(x){ return x.trim().split(/\s+/).length>=2; }).length;
      if(c.minSentences && sent < c.minSentences) ok=false;
      if(c.minWords && v.trim().split(/\s+/).filter(Boolean).length < c.minWords) ok=false;
      if(c.must) c.must.forEach(function(alts){ if(!M.check(v,{keys:[alts]})) ok=false; });
      G.cur.freeInfo = {sent:sent};
      mark(0, ok);
      return ok;
    }
    var r = M.check(vals[0], q); mark(0, r); return r;
  }

  function submit(){
    if(G.cur.finished) return;
    var q=G.qs[G.i], vals=values();
    var pending = app.querySelectorAll('.field input:not(:disabled), .field textarea:not(:disabled)');
    var empty = Array.prototype.some.call(pending, function(i){ return !i.value.trim(); });
    if(empty){ var e=Array.prototype.find.call(pending,function(i){return !i.value.trim();}); e.focus(); var qc=$('#qc'); qc.classList.remove('shake'); void qc.offsetWidth; qc.classList.add('shake'); return; }
    var ok = evaluate(q, vals);
    if(ok){ finish(true); return; }
    G.cur.wrong++;
    var qc=$('#qc'); qc.classList.remove('shake'); void qc.offsetWidth; qc.classList.add('shake');
    var hs = hintList(q);
    var box=$('#hints');
    if(G.cur.hints < hs.length){
      var hh=hs[G.cur.hints]; G.cur.hints++;
      if(q.type==='free' && G.cur.freeInfo && q.check && q.check.minSentences) hh += ' (Şu an yaklaşık '+G.cur.freeInfo.sent+' cümle var.)';
      box.insertAdjacentHTML('beforeend','<div class="hint"><b>İpucu '+G.cur.hints+'</b>'+hh+'</div>');
    } else {
      box.insertAdjacentHTML('beforeend','<div class="hint"><b>Bir daha dene</b>İpuçları bitti. İstersen “Cevabı göster”e basabilirsin.</div>');
    }
    if(G.cur.wrong>=2 || G.cur.hints>=hs.length) $('#show').style.display='';
    var f = app.querySelector('.field input:not(:disabled), .field textarea:not(:disabled)'); if(f){ f.focus(); f.select && f.select(); }
  }

  function answerText(q){
    if(q.exp) return q.exp;
    if(q.type==='parts') return q.parts.map(function(p){ return (p.label||'')+' '+(p.a?p.a[0]:p.num); }).join('<br>');
    if(q.type==='list') return q.pool.map(function(p){ return p.a?p.a[0]:(p.all||[]).map(function(g){return g[0];}).join(' – '); }).join(', ');
    return q.a? q.a[0] : String(q.num);
  }
  function altText(q){
    if(q.type || !q.a || q.a.length<2) return '';
    var uniq=[]; q.a.forEach(function(x){ if(uniq.indexOf(x)<0) uniq.push(x); });
    if(uniq.length<2) return '';
    return '<div class="alt">Kabul edilen cevaplar: '+uniq.slice(0,8).map(esc).join(' · ')+'</div>';
  }

  function animateScore(to){
    var el=$('#pts'); if(!el) return;
    var from = parseInt(el.textContent,10)||0;
    if(from===to) return;
    var steps = Math.min(Math.abs(to-from), 12), k=0;
    var iv = setInterval(function(){
      k++; el.textContent = Math.round(from+(to-from)*k/steps);
      el.classList.add('bump');
      if(k>=steps){ clearInterval(iv); el.textContent=to; setTimeout(function(){ el.classList.remove('bump'); },200); }
    }, 30);
  }

  function finish(ok){
    var q=G.qs[G.i];
    G.cur.finished=true;
    var firstTry = ok && G.cur.wrong===0;
    var bonus = 0;
    if(ok){
      if(firstTry){ G.streak++; if(G.streak>G.bestStreak) G.bestStreak=G.streak; bonus = streakBonus(G.streak); }
      else G.streak = 0;
    } else G.streak = 0;
    var pts = ok ? Math.max(10 - G.cur.wrong*2, 2) + bonus : 0;
    G.score += pts;
    var tk = q.topic||'Genel';
    var t = G.topics[tk] || (G.topics[tk]={ok:0,n:0});
    t.n++; if(ok) t.ok++;
    var p=curP();
    if(p){
      if(!p.tstats) p.tstats={};
      var sid = (qSubj.get(q)||{}).id || 'genel';
      var key = tkey(sid, tk);
      var tt=p.tstats[key]||(p.tstats[key]={ok:0,n:0,w:0}); WEAK.recordResult(tt, ok); tt.last=Date.now();
    }
    if(ok) delMistake(q); else addMistake(q);
    saveProf();
    G.log.push({q:q, ok:ok, pts:pts, bonus:bonus, streak:G.streak, wrong:G.cur.wrong});
    animateScore(G.score);
    app.querySelectorAll('.field input, .field textarea').forEach(function(i){ i.disabled=true; });
    var title;
    if(!ok) title = 'Cevap';
    else if(bonus>0) title = 'Doğru! 🔥 '+G.streak+'’li seri (+'+pts+')';
    else title = G.cur.wrong ? 'Doğru! (+'+pts+')' : 'Harika, ilk denemede doğru! (+10)';
    var extra = (q.type==='free' && ok) ? '<div class="alt">Bu soru serbest yazım sorusu; değerlendirme ölçütünü aşağıda görebilirsin.</div>' : '';
    if(bonus>0) extra += '<div class="alt">Kombo bonusu: +'+bonus+' puan (ardışık ilk-deneme doğruları).</div>';
    if(!ok && G.special!=='mistakes') extra += '<div class="alt">Bu soru “Yanlışlarım”a eklendi; ana menüden tekrar çözebilirsin.</div>';
    var mark = ok ? '<svg class="check-mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12.5l5 5L20 6.5"/></svg>' : '';
    $('#fb').innerHTML = '<div class="fb '+(ok?'ok':'bad')+'"><div class="h">'+mark+title+'</div>'+answerText(q)+altText(q)+extra+'</div>';
    if(ok){
      var combo = G.streak>=2;
      ANIM.confetti(app, combo ? 26 : 14);
      ANIM.floatPoints($('#pts'), '+'+pts+(bonus>0?' 🔥':''), bonus>0?'bonus':'');
    }
    $('#chk').style.display='none'; $('#pass').style.display='none'; $('#show').style.display='none';
    var n=$('#next'); n.style.display=''; n.focus({preventScroll:true});
    setTimeout(function(){ var fb=$('#fb'); if(fb && fb.getBoundingClientRect().bottom>window.innerHeight) fb.scrollIntoView({behavior:'smooth',block:'end'}); },50);
  }
  function reveal(){ finish(false); }
  function next(){ if(!G) return; G.i++; if(G.i>=G.qs.length) results(); else question(); }

  /* ---------- SONUÇ ---------- */
  function topicAnalysis(){
    var ks = Object.keys(G.topics);
    if(ks.length<2) return '';
    ks.sort(function(a,b){ var ra=G.topics[a].ok/G.topics[a].n, rb=G.topics[b].ok/G.topics[b].n; return ra-rb; });
    return '<div class="analysis"><h3>Konu analizi</h3><p class="an-sub">En çok zorlandığın konular üstte.</p>'+
      ks.map(function(k){
        var t=G.topics[k], p=Math.round(t.ok/t.n*100);
        var cl = p>=70?'hi':p>=40?'mid':'lo';
        return '<div class="an-row"><span class="an-name">'+esc(k)+'</span><span class="an-bar"><i class="'+cl+'" style="width:'+p+'%"></i></span><span class="an-pct '+cl+'">%'+p+'</span></div>';
      }).join('')+'</div>';
  }

  function results(){
    clearTimer();
    var s=G.s, okc=G.log.filter(function(l){return l.ok;}).length;
    var pct = Math.min(100, Math.round(G.score/maxPts()*100));
    var p=curP();
    if(p){
      if(p.best[G.key]==null || pct>p.best[G.key]) p.best[G.key]=pct;
      p.hist[G.key]=[{p:pct, s:G.score, ok:okc, n:G.qs.length, t:Date.now()}].concat(p.hist[G.key]||[]).slice(0,3);
      saveProf();
    }
    var msg = pct>=85?'Çok iyi gidiyorsun!':pct>=60?'Güzel iş, biraz daha tekrarla mükemmel olur.':pct>=35?'Fena değil, yanlışları gözden geçir.':'Konuyu tekrar edip yeniden dene.';
    var firstTry = G.log.filter(function(l){return l.ok&&!l.wrong;}).length;
    var stat = function(val, label, i){ return '<div class="stat" style="animation-delay:'+(0.08*i).toFixed(2)+'s"><b>'+val+'</b><span>'+label+'</span></div>'; };
    var h='<div class="bar" style="--sc:'+G.color+'"><button class="icon-btn" id="homeBtn">← Ana Menü</button><div class="title"><i></i>'+esc(G.name)+(G.lv?' · '+G.lv.name:'')+'</div><div class="sp"></div>'+themeBtn()+'</div>'+
      '<div class="card result" style="--sc:'+G.color+'"><div class="big" id="bigPct">%0</div><div class="sub">'+msg+'</div>'+
      '<div class="stats">'+stat(okc+'/'+G.qs.length,'Doğru',0)+stat(G.score,'Puan',1)+stat(firstTry,'İlk denemede',2)+
      stat(G.bestStreak>=2?('🔥 '+G.bestStreak):'—','En uzun seri',3)+'</div>'+
      '<div class="actions" style="justify-content:center"><button class="btn primary" id="again">Tekrar oyna</button><button class="btn" id="home2">Ana menü</button></div>'+
      topicAnalysis()+
      '<div class="review">'+G.log.map(function(l,i){
        var qt = l.q.q.replace(/<br\s*\/?>/g,' ').replace(/<[^>]+>/g,''); qt=trim(qt,140);
        return '<div class="rv" style="animation-delay:'+Math.min(0.5,0.04*i).toFixed(2)+'s"><div class="st '+(l.ok?'ok':'bad')+'">'+(l.ok?'✓':'✗')+'</div><div><div>'+(i+1)+'. '+esc(qt)+'</div><div class="ans">'+esc(trim(answerText(l.q).replace(/<br\s*\/?>/g,' · ').replace(/<[^>]+>/g,'').replace(/&amp;/g,'&'),260))+'</div></div></div>';
      }).join('')+'</div></div>';
    ANIM.render(app, h); bindTheme();
    ANIM.countUp($('#bigPct'), pct, 900, '%');
    if(pct>=85) ANIM.confetti(app, 30);
    $('#homeBtn').onclick=menu; $('#home2').onclick=menu;
    $('#again').onclick=function(){
      if(G.special==='mistakes') startMistakes();
      else if(G.special==='weak') startWeak(G.weakSubj);
      else if(G.s) startGame({s:G.s, lv:G.lv, questions:(G.lv?G.lv.questions:G.s.questions), key:G.key, name:G.name, color:G.color});
      else mixedExam();
    };
    window.scrollTo(0,0);
  }

  function confirmHome(){
    if(!G || (G.i===0 && !G.cur.wrong && !G.cur.finished)){ menu(); return; }
    var d=document.createElement('div'); d.className='modal-bg';
    d.innerHTML='<div class="modal"><h3>Ana menüye dön?</h3><p>Bu oyundaki ilerlemen kaydedilmeyecek.</p><div class="actions"><button class="btn ghost" id="mNo">Vazgeç</button><button class="btn primary" id="mYes">Ana menü</button></div></div>';
    document.body.appendChild(d);
    var close=function(){ d.remove(); document.removeEventListener('keydown',kd); };
    var kd=function(e){ if(e.key==='Escape') close(); };
    document.addEventListener('keydown',kd);
    d.onclick=function(e){ if(e.target===d) close(); };
    $('#mNo',d).onclick=close; $('#mYes',d).onclick=function(){ close(); menu(); };
    $('#mYes',d).focus();
  }
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape' && G && !document.querySelector('.modal-bg')) confirmHome();
    if(e.key==='Enter' && G && G.cur && G.cur.finished && !(document.activeElement && /^(BUTTON|A|INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)) && !document.querySelector('.modal-bg')){ e.preventDefault(); next(); }
  });
  menu();
})();

</script>
</body>
